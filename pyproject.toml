[project]
name = "healthcare-ai-assistant"
version = "0.1.0"
description = "Member-facing health plan assistant: LLM agent with tools, guardrails and evals (synthetic data)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "ipykernel>=7.4.0",
    "langgraph>=1.2.24",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openai>=3.58.0",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio: run `async def test_...` functions automatically, no decorator needed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
